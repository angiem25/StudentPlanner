plugins {
    id 'java'
    id 'application'
}

group = 'com.planner'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.formdev:flatlaf:3.4.1'
    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testImplementation 'org.mockito:mockito-core:5.1.1'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.1.1'
}

application {
    mainClass = 'planner.Main'
}

test {
    useJUnitPlatform()
}

// Run the planner application
task runPlanner(type: JavaExec) {
    group = 'application'
    description = 'Run the student planner application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'planner.Main'
}

// Generate Javadoc
javadoc {
    group = 'documentation'
    description = 'Generate Javadoc API documentation'
    
    source = sourceSets.main.allJava
    classpath = sourceSets.main.compileClasspath
    
    options {
        encoding = 'UTF-8'
        docEncoding = 'UTF-8'
        charSet = 'UTF-8'
        
        // General options
        version = true
        author = true
        splitIndex = true
        use = true
        windowTitle = 'Student Planner API Documentation'
        docTitle = 'Student Planner API Documentation'
        header = 'Student Planner API'
        footer = 'Generated by Javadoc'
        
        // Links to external documentation
        links = ['https://docs.oracle.com/en/java/javase/21/docs/api/']
        
        // Exclude test files
        exclude '**/test/**'
        
        // Show protected members
        showFromProtected()
        
        // Additional options for better documentation
        addStringOption('Xdoclint:none', '-quiet')
    }
    
    // Destination directory
    destinationDir = file("${buildDir}/docs/javadoc")
}

// Create a task to open the generated documentation
task openJavadoc(type: Exec) {
    group = 'documentation'
    description = 'Open the generated Javadoc in the default browser'
    
    dependsOn javadoc
    
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        commandLine 'open', "${buildDir}/docs/javadoc/index.html"
    } else if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'start', "${buildDir}/docs/javadoc/index.html"
    } else {
        commandLine 'xdg-open', "${buildDir}/docs/javadoc/index.html"
    }
}

